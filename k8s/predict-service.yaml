apiVersion: v1
kind: Service
metadata:
  name: houseprice-predict-service
  labels:
    app: houseprice-predict
spec:
  type: NodePort
  selector:
    app: houseprice-predict
  ports:
    - protocol: TCP
      port: 8000          # Port inside the cluster
      targetPort: 8000    # Port the FastAPI container listens on
      nodePort: 30800     # Port to access from outside (browser/curl)
