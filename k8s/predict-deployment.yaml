apiVersion: apps/v1
kind: Deployment
metadata:
  name: houseprice-predict
  labels:
    app: houseprice-predict
    version: v5
spec:
  replicas: 2                         # Run 2 replicas for high availability
  selector:
    matchLabels:
      app: houseprice-predict
  template:
    metadata:
      labels:
        app: houseprice-predict
        version: v5
    spec:
      containers:
        - name: houseprice-predict
          image: houseprice-estimator:v5
          imagePullPolicy: Never        # Use local image loaded into Kind cluster
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: "model/model.pkl"
            # MLflow 3.x: Use SQLite inside container — no external server needed
            - name: MLFLOW_TRACKING_URI
              value: "sqlite:///mlflow-data/mlflow.db"
            # Ensure Python resolves src/ module correctly
            - name: PYTHONPATH
              value: "/app"
          # Liveness probe — restart pod if app hangs or crashes
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Readiness probe — only route traffic when app is fully ready
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
