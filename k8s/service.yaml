apiVersion: v1
kind: Service
metadata:
  name: houseprice-estimator-service
  labels:
    app: houseprice-estimator
spec:
  type: NodePort          # Exposes the service on a port of the Kind node
  selector:
    app: houseprice-estimator
  ports:
    - protocol: TCP
      port: 5000          # Port inside the cluster
      targetPort: 5000    # Port the container is listening on
      nodePort: 30500     # Port you access from outside (30000-32767)
