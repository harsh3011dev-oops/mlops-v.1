<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price AI Estimator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        .form-group input, .form-group select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-predict {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        .result-card {
            margin-top: 30px;
            padding: 24px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .result-card.active {
            display: block;
        }

        .result-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .result-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .status-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏡 House Price AI Estimator</h1>
            <p>Powered by Machine Learning & Kubernetes Service</p>
        </div>

        <form id="predictionForm">
            <div class="grid">
                <div class="form-group">
                    <label for="LotArea">Lot Area (sq ft)</label>
                    <input type="number" id="LotArea" value="8450" required>
                </div>
                <div class="form-group">
                    <label for="OverallQual">Overall Quality (1-10)</label>
                    <input type="number" id="OverallQual" min="1" max="10" value="7" required>
                </div>
                <div class="form-group">
                    <label for="OverallCond">Overall Condition (1-10)</label>
                    <input type="number" id="OverallCond" min="1" max="10" value="5" required>
                </div>
                <div class="form-group">
                    <label for="YearBuilt">Year Built</label>
                    <input type="number" id="YearBuilt" value="2003" required>
                </div>
                <div class="form-group">
                    <label for="GrLivArea">Above Ground Living Area (sq ft)</label>
                    <input type="number" id="GrLivArea" value="1710" required>
                </div>
                <div class="form-group">
                    <label for="GarageCars">Garage Size (Cars)</label>
                    <input type="number" id="GarageCars" min="0" max="5" value="2" required>
                </div>
            </div>

            <button type="submit" class="btn-predict">Predict House Price</button>
        </form>

        <div id="resultCard" class="result-card">
            <div class="result-title">Estimated Market Value</div>
            <div id="priceDisplay" class="result-price">$0</div>
            <div class="status-badge" id="modelBadge">Model: RandomForestRegressor</div>
        </div>
    </div>

    <script>
        function formatIndianCurrency(amountInINR) {
            const formattedNumber = amountInINR.toLocaleString('en-IN', {
                maximumFractionDigits: 0
            });

            let words = "";
            if (amountInINR >= 10000000) {
                words = ` (${(amountInINR / 10000000).toFixed(2)} Crore)`;
            } else if (amountInINR >= 100000) {
                words = ` (${(amountInINR / 100000).toFixed(2)} Lakh)`;
            }

            return `₹ ${formattedNumber}${words}`;
        }

        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const payload = {
                LotArea: parseFloat(document.getElementById('LotArea').value),
                OverallQual: parseInt(document.getElementById('OverallQual').value),
                OverallCond: parseInt(document.getElementById('OverallCond').value),
                YearBuilt: parseInt(document.getElementById('YearBuilt').value),
                GrLivArea: parseFloat(document.getElementById('GrLivArea').value),
                GarageCars: parseInt(document.getElementById('GarageCars').value)
            };

            const btn = document.querySelector('.btn-predict');
            btn.textContent = 'Calculating...';
            btn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    const priceInUSD = Number(data.predicted_price);
                    // Conversion rate 1 USD ~ 83 INR
                    const priceInINR = priceInUSD * 83;

                    const priceDisplay = document.getElementById('priceDisplay');
                    priceDisplay.textContent = formatIndianCurrency(priceInINR);
                    
                    document.getElementById('modelBadge').textContent = `USD: $${priceInUSD.toLocaleString('en-US', {maximumFractionDigits: 0})} | Model: ${data.model || 'RandomForestRegressor'}`;
                    document.getElementById('resultCard').classList.add('active');
                } else {
                    alert('Prediction error: ' + (data.detail || 'Failed to get prediction'));
                }
            } catch (err) {
                alert('Could not connect to Prediction API. Make sure backend service is running!');
                console.error(err);
            } finally {
                btn.textContent = 'Predict House Price';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
