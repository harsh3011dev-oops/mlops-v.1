name: MLOps Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Test, Train & Validate API
  # ─────────────────────────────────────────────────
  test-and-train:
    runs-on: ubuntu-latest

    env:
      # MLflow 3.x: SQLite backend — no server needed in CI
      MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
      PYTHONPATH: "."

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Unit & Integration Tests
        run: |
          python -m pytest tests/ -v

      - name: Run Model Training & Artifact Generation
        run: |
          python train.py

      - name: Verify FastAPI Health Check
        run: |
          uvicorn predict_app:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/health

  # ─────────────────────────────────────────────────
  # Job 2: Build & Validate Docker Image
  # Runs only after test-and-train passes
  # ─────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-train          # Only runs if Job 1 passes

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (to run train.py for model artifact)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Model Artifact (required by Docker COPY model/)
        run: |
          MLFLOW_TRACKING_URI=sqlite:///mlflow.db PYTHONPATH=. python train.py

      - name: Build Docker Image
        run: |
          docker build -t houseprice-estimator:v5 .

      - name: Smoke Test Docker Container
        run: |
          docker run -d --name test-container -p 8000:8000 houseprice-estimator:v5
          sleep 10
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health
          docker stop test-container
          docker rm test-container
