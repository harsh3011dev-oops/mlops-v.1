name: MLOps Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    env:
      # Use local file-based MLflow tracking in CI (no server needed)
      MLFLOW_TRACKING_URI: "file:./mlruns"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Unit & Integration Tests
        run: |
          python -m pytest tests/ -v

      - name: Run Model Training & Artifact Generation
        run: |
          python train.py

      - name: Verify API Build & FastAPI Health Check
        run: |
          uvicorn predict_app:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/health
